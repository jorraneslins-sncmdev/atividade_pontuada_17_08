<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Pontuada</title>,
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container-form {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .cadastro-livros {
            display: grid;
            grid-template-columns: 2fr auto;
            grid-column: 2;
            border: 1px solid black;
            width: 300px;
            gap: 2px;
            align-items: center;
            justify-content: center;
            margin: 10px;
            padding: 15px;
            border-radius: 10px;
        }

        .cadastro-livros button {
            padding: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cadastro-livros button:hover {
            transform: translateY(-3px);
            background-color: lightblue;
        }

        .container-lista {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lista {
            border: 1px solid black;
            width: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            margin: 10px;
        }

        .container-lista ul li {
            list-style: none;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="container-form">
        <h1>Biblioteca Universal</h1>
        <form class="cadastro-livros">
            <label for="codigo">Codigo:</label>
            <input type="text" name="codigo">
            <label for="titulo">Titulo</label>
            <input type="text" name="titulo">
            <label for="autor">Autor:</label>
            <input type="text" name="autor">
            <label for="anoPublicacao">Ano de Publicação</label>
            <input type="text" name="anoPublicacao">
            <button type="submit">Registrar Livro</button>
        </form>
    </div>

    <div class="container-lista">
        <ul class="lista">
            <h1>Tela de Consulta</h1>
            <li></li>
        </ul>
    </div>

    <script>
        const form = document.querySelector(".cadastro-livros");
        const lista = document.querySelector(".lista");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const livroAdd = {
                codigo: event.target.codigo.value,
                titulo: event.target.titulo.value,
                autor: event.target.autor.value,
                anoPublicacao: event.target.anoPublicacao.value
            }

            const li = document.createElement("li");
            li.textContent = `Codigo: ${livroAdd.codigo} | Titulo: ${livroAdd.titulo} | Autor: ${livroAdd.autor} | Ano de Publicação: ${livroAdd.anoPublicacao}`
            lista.appendChild(li)
        })


    </script>
</body>

</html>
